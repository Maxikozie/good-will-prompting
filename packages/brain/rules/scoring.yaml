# SPEC §8: every weight, tier weight, half-life default and band lives here (versioned, part of rulesVersion).
version: 1
weights: { verification: 0.30, authority: 0.20, ownership: 0.15, consensus: 0.15, integrity: 0.10, usage: 0.10 }
tierWeights: { T0: 0, T1: 0.3, T2: 0.6, T3: 0.85, T4: 1.0 }
authority:
  evidence: { law: 1.0, owner_policy: 0.85, sharepoint: 0.7, manual: 0.7, ticket: 0.5, teams: 0.4, email: 0.3, other: 0.2 }
  reference: { default: 0.5, official_owned: 0.7 }
ownership: { active: 1.0, inactive: 0.4, none: 0.2 }
consensusPerGroup: 0.35
conflictPenalty: { high: 30, medium: 15, low: 5, max: 40 }
gates: { expired: 10, superseded: 20, invalidated: 30, not_a_rule: 25, duplicate_older: 20 }
bands: { trusted: 80, careful: 60 }
# stage 40 (gaps): WEAK_SUPPORT when the best claim scores below `scoreBelow`, or the only independent source has authority below `lowAuthorityBelow`
weakSupport: { scoreBelow: 60, lowAuthorityBelow: 0.5 }
# half-life of a verification in days, used when a slot template does not set `halfLifeDays`
halfLifeDays: 365
# wiki pages carry no verification tier: an official page with an owner and a verification date counts as this tier, otherwise T0
reference: { verifiedTier: T2 }
# integrity I: unverified claims are neutral; when a verified document was edited afterwards and the share of changed claims is unknown
integrity: { neverVerified: 0.5, unknownDrift: 0.5 }
# usage U: Beta-smoothed resolved / (resolved + reopened); neutral when there is no data
usage: { neutral: 0.5 }
# SPEC §8.2: FactConfidence = min(100, winnerScore + corroborationBonus × min(1, independentCorroborations / corroborationsForFullBonus)) × ScopeFit
corroboration: { bonus: 10, forFullBonus: 2 }
scopeFit: { exact: 1.0, parent: 0.8, productUnknown: 0.6, otherCountry: 0 }
